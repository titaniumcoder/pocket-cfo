root = "."
tmp_dir = "tmp"

[build]
  cmd = "go generate ./... && go build -o ./tmp/pocketcfo ./cmd/pocketcfo"
  bin = "tmp/pocketcfo"
  full_bin = "tmp/pocketcfo"
  include_ext = ["go", "tmpl", "html", "json"]
  exclude_dir = ["tmp", "build", "data", "catalog", "testdata", ".git", "internal/schema"]
  exclude_regex = ["_test\\.go"]
  delay = 200
  stop_on_error = true
  log = "build-errors.log"

[log]
  time = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
