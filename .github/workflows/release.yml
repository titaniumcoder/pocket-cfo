# Publishes the Docker image on a version tag push. Tags are created
# locally by the "release-it" Claude Code skill (.claude/skills/release-it/
# SKILL.md), not by GitHub Actions — it analyzes commits since the last
# release, proposes a version, and only tags/pushes once a human confirms.
# See AGENTS.md's "Releases" section.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish-image:
    name: Build and push the Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
