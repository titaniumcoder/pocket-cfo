# Publishes the Docker image and standalone cross-platform binaries on a
# version tag push. Tags are created locally by the "release-it" Claude
# Code skill (.agents/skills/release-it/SKILL.md, symlinked from
# .claude/skills/), not by GitHub Actions — it analyzes commits since the
# last release, proposes a version, and only tags/pushes once a human
# confirms. See AGENTS.md's "Releases" section.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish-image:
    name: Build and push the Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

      - name: Notify pocket-cfo-data
        env:
          GH_TOKEN: ${{ secrets.POCKET_CFO_DATA_DISPATCH_TOKEN }}
        run: |
          gh api repos/titaniumcoder/pocket-cfo-data/dispatches \
            -f event_type=pocket-cfo-released \
            -f "client_payload[tag]=${{ github.ref_name }}"

  publish-binaries:
    name: Build and attach release binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate
        run: go generate ./...

      # No CGO dependencies anywhere in the module, so a single Linux
      # runner can cross-compile every target directly - no matrix of
      # OS-specific runners needed. Each archive bundles both executables
      # (pocketcfo, pocket-cfo-ctl) for one platform, named/extensioned per
      # that platform's convention (.zip + .exe on Windows, .tar.gz
      # elsewhere), and is uploaded straight to this tag's GitHub Release
      # so they're plain top-level download links, not buried in an image.
      - name: Cross-compile and package
        run: |
          set -euo pipefail
          mkdir -p dist
          version="${{ github.ref_name }}"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            [ "$os" = "windows" ] && ext=".exe"
            workdir=$(mktemp -d)
            for bin in pocketcfo pocket-cfo-ctl; do
              echo "Building ${bin} for ${os}/${arch}"
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -o "${workdir}/${bin}${ext}" "./cmd/${bin}"
            done
            pkgname="pocketcfo_${version}_${os}_${arch}"
            if [ "$os" = "windows" ]; then
              (cd "$workdir" && zip -q "${OLDPWD}/dist/${pkgname}.zip" pocketcfo.exe pocket-cfo-ctl.exe)
            else
              tar czf "dist/${pkgname}.tar.gz" -C "$workdir" pocketcfo pocket-cfo-ctl
            fi
            rm -rf "$workdir"
          done
          ls -la dist/

      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/*.tar.gz dist/*.zip --clobber --repo "${{ github.repository }}"
