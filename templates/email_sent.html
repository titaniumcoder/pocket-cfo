<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PocketCFO</title>
  <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&display=block" rel="stylesheet">
  <style>
    body {
      font-family: 'PT Sans', 'DejaVu Sans', sans-serif;
      display: flex; align-items: center; justify-content: center;
      height: 100vh; margin: 0; background: #f4f9f5; color: #1c2430; text-align: center;
    }
    main { max-width: 320px; }
    p.muted { color: #6b7684; font-size: 13px; }
    a { color: #1c2430; }
    @media (max-width: 640px) {
      body { padding: 24px; height: auto; min-height: 100vh; }
    }
  </style>
</head>
<body>
  <main>
    <p>If that address is authorized, a login link is on its way — check your inbox.</p>
    <p class="muted">The link expires shortly, so use it soon. <a href="/">&larr; Back</a></p>
  </main>
</body>
</html>
