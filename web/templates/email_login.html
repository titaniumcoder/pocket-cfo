<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invoicer</title>
  <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&display=block" rel="stylesheet">
  <style>
    body {
      font-family: 'PT Sans', 'DejaVu Sans', sans-serif;
      display: flex; align-items: center; justify-content: center;
      height: 100vh; margin: 0; background: #f4f9f5; color: #1c2430;
    }
    form {
      display: flex; flex-direction: column; gap: 12px; width: 280px;
    }
    input[type="email"] {
      padding: 12px 14px; border-radius: 8px; border: 1px solid #c7d0c9; font-size: 16px;
    }
    button {
      background: #1c2430; color: #fff; border: none; cursor: pointer;
      padding: 12px 24px; border-radius: 8px; font-weight: 700; font-size: 16px;
    }
    .error { color: #b3261e; font-size: 13px; margin: 0 0 4px; }
    .back { text-align: center; font-size: 13px; margin-top: 4px; }
    .back a { color: #1c2430; }
    @media (max-width: 640px) {
      body { padding: 24px; height: auto; min-height: 100vh; }
    }
  </style>
</head>
<body>
  <form method="post" action="/auth/email">
    {{if .Error}}<p class="error">That link is invalid or has expired — request a new one below.</p>{{end}}
    <input type="email" name="email" placeholder="you@example.com" required autofocus>
    <button type="submit">Email me a login link</button>
    <div class="back"><a href="/">&larr; Back</a></div>
  </form>
</body>
</html>
